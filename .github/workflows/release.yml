name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            publish_cmd: npm run release:win
          - os: ubuntu-22.04
            publish_cmd: npm run release:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.publish_cmd }}

      - name: Summarize artifacts
        if: always()
        shell: bash
        run: |
          echo "Version from package.json:"
          node -p "require('./package.json').version"
          echo "Release folder (if present):"
          ls -la release 2>/dev/null || ls -la dist 2>/dev/null || true
